<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HGW · Overlay OBS (1920 × 1080, fond transparent)</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@600;700&family=Plus+Jakarta+Sans:wght@500;600;700&family=Space+Grotesk:wght@700&display=swap"
      rel="stylesheet"
    />
    <!--
      Paramètres : ?pos=tl|tr|bl|br (coin du panneau, tl par défaut) · ?compact=1 (top 3, sans pied).
    -->
    <style>
      :root {
        --panel: rgba(19, 22, 29, 0.88);
        --raised: rgba(27, 31, 40, 0.9);
        --line-subtle: #2c3240;
        --ink-1: #f2f5f7;
        --ink-2: #b4bdc9;
        --ink-3: #929dad;
        --ink-on-gold: #17110a;
        --gold-500: #f5a314;
        --gold-subtle: rgba(42, 33, 18, 0.95);
        --success-500: #2fcf8f;
        --shadow-modal: 0 24px 56px -12px rgba(0, 0, 0, 0.85);
        --shadow-glow-gold: 0 0 0 1px rgba(245, 163, 20, 0.45), 0 0 28px rgba(245, 163, 20, 0.3);
        --font-display: 'Space Grotesk', system-ui, sans-serif;
        --font-sans: 'Plus Jakarta Sans', system-ui, sans-serif;
        --font-mono: 'JetBrains Mono', ui-monospace, monospace;
      }
      * { box-sizing: border-box; margin: 0; padding: 0; }
      html, body { width: 100vw; height: 100vh; overflow: hidden; background: transparent !important; font-family: var(--font-sans); color: var(--ink-1); -webkit-font-smoothing: antialiased; }

      .alerts { position: fixed; top: 28px; left: 50%; transform: translateX(-50%); display: flex; flex-direction: column; align-items: center; gap: 10px; pointer-events: none; }
      .alert { display: flex; align-items: center; gap: 14px; min-width: 440px; max-width: 760px; padding: 14px 22px; border-radius: 14px; background: var(--panel); backdrop-filter: blur(12px); box-shadow: var(--shadow-modal), var(--shadow-glow-gold); animation: in 0.35s cubic-bezier(0.16, 1, 0.3, 1) both; }
      .alert__badge { flex: none; padding: 6px 10px; border-radius: 6px; background: var(--gold-500); color: var(--ink-on-gold); font: 700 12px/1 var(--font-display); letter-spacing: 0.06em; text-transform: uppercase; }
      .alert__text { font: 700 17px/24px var(--font-sans); }
      @keyframes in { from { opacity: 0; transform: translateY(-24px) scale(0.96); } to { opacity: 1; transform: none; } }

      .hud { position: fixed; top: 28px; left: 28px; width: 340px; padding: 14px 16px; border-radius: 14px; background: var(--panel); backdrop-filter: blur(12px); border: 1px solid var(--line-subtle); box-shadow: var(--shadow-modal); }
      .hud.pos-tr { left: auto; right: 28px; }
      .hud.pos-bl { top: auto; bottom: 28px; }
      .hud.pos-br { top: auto; left: auto; bottom: 28px; right: 28px; }
      .hud__head { display: flex; align-items: center; justify-content: space-between; padding-bottom: 10px; margin-bottom: 10px; border-bottom: 1px solid var(--line-subtle); }
      .brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
      .brand__mark { padding: 4px 7px; border-radius: 6px; background: var(--gold-500); color: var(--ink-on-gold); font: 700 13px/1 var(--font-display); flex: none; }
      .brand__title { font: 700 13px/16px var(--font-sans); letter-spacing: 0.06em; text-transform: uppercase; color: var(--ink-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .live { display: inline-flex; align-items: center; gap: 6px; font: 700 12px/1 var(--font-sans); color: var(--ink-2); flex: none; }
      .live i { width: 8px; height: 8px; border-radius: 50%; background: var(--success-500); }
      .live.off i { background: var(--ink-3); }
      .row { display: flex; align-items: center; gap: 10px; padding: 7px 10px; border-radius: 8px; margin-bottom: 4px; background: var(--raised); }
      .row.is-1 { background: var(--gold-subtle); }
      .row__rank { width: 20px; font: 700 14px/1 var(--font-mono); color: var(--ink-2); }
      .row.is-1 .row__rank { color: var(--gold-500); }
      .row__name { flex: 1; font: 600 15px/20px var(--font-sans); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .row__pts { font: 700 15px/1 var(--font-mono); font-variant-numeric: tabular-nums; }
      .row.is-1 .row__pts { color: var(--gold-500); }
      .hud__foot { display: flex; justify-content: space-between; gap: 10px; margin-top: 10px; padding-top: 8px; border-top: 1px solid var(--line-subtle); font: 500 13px/18px var(--font-sans); color: var(--ink-2); }
      .hud__foot b { color: var(--ink-1); font-weight: 600; }
      .mono { font-family: var(--font-mono); font-weight: 600; color: var(--ink-1); }
      .compact .hud__foot { display: none; }
      .compact.hud { width: 280px; }
      @media (prefers-reduced-motion: reduce) { .alert { animation: none; } }
    </style>
  </head>
  <body>
    <div class="alerts" id="alerts"></div>

    <aside class="hud" id="hud">
      <div class="hud__head">
        <div class="brand">
          <span class="brand__mark">HGW</span>
          <span class="brand__title" id="hud-title">Classement</span>
        </div>
        <span class="live off" id="live"><i></i>En direct</span>
      </div>
      <div id="top"></div>
      <div class="hud__foot">
        <span id="foot-feat"></span>
        <span id="foot-tombola"></span>
      </div>
    </aside>

    <script>
      const params = new URLSearchParams(location.search);
      const hud = document.getElementById('hud');
      const pos = params.get('pos');
      if (['tr', 'bl', 'br'].includes(pos)) hud.classList.add('pos-' + pos);
      const compact = params.get('compact') === '1';
      if (compact) hud.classList.add('compact');

      const esc = (s) => String(s ?? '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
      const plain = (s) => String(s ?? '').replace(/[\p{Extended_Pictographic}\u{FE0F}\u{200D}]/gu, '').replace(/\s{2,}/g, ' ').trim();

      function pushAlert(badge, message) {
        const box = document.getElementById('alerts');
        const el = document.createElement('div');
        el.className = 'alert';
        el.innerHTML = `<span class="alert__badge">${esc(badge)}</span><div class="alert__text">${esc(plain(message))}</div>`;
        box.appendChild(el);
        setTimeout(() => el.remove(), 6500);
      }

      async function refresh() {
        try {
          const state = await (await fetch('/api/state')).json();
          const cfg = state.eventSettings || {};
          const feat = cfg.featured || {};
          document.getElementById('hud-title').textContent = cfg.event_name || 'Classement';

          const lb = (state.leaderboard || []).slice(0, compact ? 3 : 5);
          let prev = null;
          let rank = 0;
          document.getElementById('top').innerHTML = lb
            .map((p, i) => {
              if (p.total_points !== prev) rank = i + 1;
              prev = p.total_points;
              return `<div class="row ${rank === 1 ? 'is-1' : ''}"><span class="row__rank">${rank}</span><span class="row__name">${esc(p.display_name)}</span><span class="row__pts">${p.total_points.toLocaleString('fr-FR')}</span></div>`;
            })
            .join('');

          const wr = (state.featuredLadder || state.weeklyTmnfLeaderboard || [])[0];
          const footFeat = document.getElementById('foot-feat');
          if (feat.enabled && feat.ladder_enabled) {
            footFeat.innerHTML = wr
              ? `Leader ${esc(feat.title)} <b>${esc(wr.display_name)}</b> <span class="mono">${esc(wr.formatted_value || wr.formatted_time)}</span>`
              : `${esc(feat.title)} · ${esc(feat.ladder_title || 'Ladder')}`;
          } else {
            footFeat.textContent = `${(state.leaderboard || []).length} joueurs`;
          }
          const q = (state.leaderboard || []).filter((p) => p.tombola_eligible).length;
          document.getElementById('foot-tombola').textContent = `${q} qualifié${q > 1 ? 's' : ''} tombola`;
        } catch {
          /* réseau indisponible : on réessaie au prochain événement */
        }
      }

      const LABELS = {
        tmnf_live_finish: 'Record serveur',
        tmnf_replay: 'Replay validé',
        featured_updated: 'Jeu vedette',
        points_updated: 'Points',
        teams_drawn: 'Tirage des équipes',
        tombola_winner: 'Tombola',
      };
      const es = new EventSource('/api/events');
      const live = document.getElementById('live');
      es.onopen = () => live.classList.remove('off');
      es.onerror = () => live.classList.add('off');
      es.onmessage = (ev) => {
        try {
          const data = JSON.parse(ev.data);
          if (data.type === 'connected') return;
          if (data.message) pushAlert(LABELS[data.type] || 'HGW', data.message);
          refresh();
        } catch {
          /* battement de cœur */
        }
      };
      refresh();
      setInterval(refresh, 60000);
    </script>
  </body>
</html>
